<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course details · MyCourses</title>
    <!-- FED-40 — apply appearance before first paint to prevent FOUC -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('mycourses:appearance');
                var resolved = stored;
                if (stored !== 'light' && stored !== 'dark') {
                    resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', resolved);
            } catch (e) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>
    <link rel="preconnect" href="https://www.impactmojo.in">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/appearance.css">
    <link rel="stylesheet" href="css/course-details.css">
</head>
<body class="bg-light">
    <div class="app-shell">
        <aside class="sidebar-nav" id="mainSidebar" data-sidebar data-current="explore"></aside>

        <div class="app-content">
            <header class="navbar navbar-light bg-white border-bottom py-3 sticky-top">
                <div class="container">
                    <div class="header-container d-flex w-100 align-items-center gap-2 gap-md-3">

                        <button class="navbar-toggler border-0 shadow-none d-md-none flex-shrink-0"
                                type="button"
                                data-sidebar-toggle="mainSidebar"
                                aria-controls="mainSidebar"
                                aria-expanded="false"
                                aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <nav class="app-breadcrumb" data-breadcrumb aria-label="Breadcrumb"></nav>

                        <div class="header-search" dir="ltr">
                            <div class="input-group rounded-3 overflow-hidden border bg-light">
                                <span class="input-group-text bg-transparent border-0 ps-3 text-muted">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </span>
                                <input type="search"
                                       class="form-control border-0 shadow-none bg-transparent"
                                       placeholder="Search courses, instructors, levels..."
                                       aria-label="Global search">
                            </div>
                        </div>

                        <div class="header-actions">
                            <button class="app-icon-btn" type="button" aria-label="Notifications">
                                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                            </button>

                            <button class="app-theme-toggle" type="button" aria-label="Toggle appearance" data-theme-toggle>
                                <i class="fa-regular fa-moon theme-toggle-moon" aria-hidden="true"></i>
                                <i class="fa-solid fa-sun theme-toggle-sun" aria-hidden="true"></i>
                            </button>

                            <div class="profile-section d-flex align-items-center gap-2 cursor-pointer flex-shrink-0">
                                <div class="avatar-icon">
                                    <span class="avatar-initials" id="header-avatar">L</span>
                                </div>
                                <span class="fw-medium text-secondary fs-6 d-none d-lg-inline" id="header-greeting-name">Hi, Learner!</span>
                                <i class="fa-solid fa-chevron-down text-secondary fs-6 d-none d-lg-inline"></i>
                            </div>
                        </div>

                    </div>
                </div>
            </header>

            <main class="app-main course-details-page" aria-busy="true">
                <section data-state="loading" class="container my-3 my-lg-4" aria-hidden="true">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="skeleton-box" style="width: 120px; height: 1.25rem;"></div>
                        <div class="skeleton-box d-none d-md-block" style="width: 200px; height: 1.25rem;"></div>
                    </div>
                    <div class="row g-4">
                        <div class="col-12 col-lg-8">
                            <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 p-lg-5 cd-skeleton-hero">
                                <div class="d-flex flex-wrap gap-2 mb-3">
                                    <div class="skeleton-box cd-skeleton-badge"></div>
                                    <div class="skeleton-box cd-skeleton-badge"></div>
                                    <div class="skeleton-box cd-skeleton-badge"></div>
                                </div>
                                <div class="skeleton-box cd-skeleton-title mb-3"></div>
                                <div class="skeleton-box skeleton-line"></div>
                                <div class="skeleton-box skeleton-line"></div>
                                <div class="skeleton-box skeleton-line skeleton-line--short mb-0"></div>
                            </div>
                            <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 mt-4 cd-skeleton-build">
                                <div class="skeleton-box skeleton-line" style="width: 35%;"></div>
                                <div class="skeleton-box skeleton-line mb-0"></div>
                            </div>
                            <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 mt-4 cd-skeleton-content">
                                <div class="skeleton-box skeleton-line mb-3" style="width: 40%;"></div>
                                <div class="skeleton-box skeleton-line mb-2"></div>
                                <div class="skeleton-box skeleton-line mb-2"></div>
                                <div class="skeleton-box skeleton-line mb-2"></div>
                                <div class="skeleton-box skeleton-line skeleton-line--short mb-0"></div>
                            </div>
                        </div>
                        <div class="col-12 col-lg-4">
                            <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 cd-skeleton-aside">
                                <div class="skeleton-box skeleton-line mb-3" style="width: 50%;"></div>
                                <div class="skeleton-box skeleton-line mb-4" style="width: 80%;"></div>
                                <div class="skeleton-box mb-3 rounded-3" style="height: 2.75rem;"></div>
                                <div class="skeleton-box mb-4 rounded-3" style="height: 2.75rem;"></div>
                                <div class="skeleton-box skeleton-line mb-2"></div>
                                <div class="skeleton-box skeleton-line mb-2"></div>
                                <div class="skeleton-box skeleton-line skeleton-line--short mb-0"></div>
                            </div>
                        </div>
                    </div>
                </section>
                <section data-state="error" hidden></section>
                <section data-state="not-found" hidden></section>
                <article data-state="success" hidden></article>
                <section data-state="no-sections" hidden></section>
            </main>

            <footer class="bg-white border-top py-3 mt-auto">
                <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                    <span class="text-muted small">&copy; 2024 MyCourses. All rights reserved.</span>
                    <span class="text-muted small" id="cd-footer-attribution">Content © ImpactMojo, CC BY-NC-ND 4.0 — https://impactmojo.in</span>
                </div>
            </footer>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/profile-storage.js"></script>
    <script defer src="js/favorites-storage.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/courses-api.js"></script>
    <script defer src="js/course-details.js"></script>
</body>
</html>
