<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Courses Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    </head>
    <body class="bg-light">
    <!--header section (FED-02)-->   
    <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 sticky-top">
    <div class="container">
        <!-- Logo  -->
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="#">
            <i class="fa-solid fa-graduation-cap text-primary me-2"></i>
            <span class="text-dark">My</span><span class="text-primary">Courses</span>
        </a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mobileNav">

            <ul class="navbar-nav ms-lg-4 me-lg-auto my-2 my-lg-0 gap-1 gap-lg-2">
    <li class="nav-item">
        <a class="nav-link custom-nav-item rounded-2 d-flex align-items-center px-3 py-2" href="#">
            <i class="fa-solid fa-house text-secondary me-3 d-lg-none"></i> Home
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link custom-nav-item rounded-2 d-flex align-items-center px-3 py-2" href="#">
            <i class="fa-solid fa-book-open text-secondary me-3 d-lg-none"></i> Courses
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link custom-nav-item rounded-2 d-flex align-items-center px-3 py-2" href="#">
            <i class="fa-solid fa-circle-info text-secondary me-3 d-lg-none"></i> About
        </a>
    </li>

</ul>
        <div class="profile-section d-flex align-items-center justify-content-between justify-content-lg-start gap-2 cursor-pointer  py-lg-0 px-lg-0">
                <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center avatar-icon">
                        <i class="fa-solid fa-user text-secondary"></i>
                    </div>
                    <span class="fw-medium text-secondary fs-6">Hi, Learner!</span>
                </div>
                <i class="fa-solid fa-chevron-down text-secondary fs-6 profile-arrow"></i>
            </div>
        </div>

    </div>
</header>

<!-- Welcome Section (FED-04) -->
<section class="container my-3">
    <div class="welcome-card rounded-4    py-3 px-4 py-md-4 px-md-5">
        <div class="row align-items-center gy-4">
            
            <div class="col-12 col-md-7 col-lg-8">
                <span class="welcome-badge fw-bold text-uppercase small d-block mb-2">
                    WELCOME BACK!
                </span>
                <h1 class="fw-bold text-dark display-6 mb-3">
                    My Courses
                </h1>
                <p class="text-muted fs-6 mb-0 pe-md-4">
                    Keep learning, keep growing. Here are the courses available for you.
                </p>
            </div>

            <div class="col-12 col-md-5 col-lg-4 text-center text-md-end">
                <div class="book-img-wrapper">
                    <img src="assets/images/hero-img.webp" alt="Online learning and courses illustration" class="book-img">
                </div>
            </div>

        </div>
    </div>
</section>


<!-- Courses Header & Search Section -->
<section class="container my-3">
    <h2 class="fw-bold text-dark mb-1">Courses</h2>
    <p class="text-muted fs-6 mb-3 d-block d-lg-none">Discover and learn new skills</p>

    <div class="row g-3 align-items-center">
    <!-- Search Bar -->
    <div class="col-12 col-md-8 col-lg-9">
    <div class="input-group search-bar rounded-3 overflow-hidden border bg-white shadow-sm">
        <span class="input-group-text bg-white border-0 ps-3 text-muted">
            <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" id="search-input" class="form-control border-0 shadow-none py-2 px-2 text-muted" placeholder="Search courses...">
        <button id="clear-search" class="btn btn-white border-0 text-muted d-none" type="button" aria-label="Clear search input">
        <i class="fa-solid fa-times"></i>
        </button>    
        </div>
    </div>

    <!--category drpdown-->
    <div class="col-12 col-md-4 col-lg-3">
            <select id="category-filter" class="form-select rounded-3 py-2 border shadow-sm text-secondary bg-white" aria-label="Category filter">
                <option value="All" selected>All Categories</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Database">Database</option>
            </select>
        </div>
    </div>    
</section>


<!-- Courses Grid Section (FED-06) -->
<section class="container my-3">
    <div class="row g-4" id="courses-container">
    </div>
    <!-- No Courses Found Message -->
    <div id="no-results" class="d-none text-center py-5 my-5">
        <i class="fa-solid fa-magnifying-glass fs-1 text-primary-subtle mb-4"></i>
        <h4 class="fw-bold text-dark mb-3">No courses found</h4>
        <p class="text-muted mb-3">Try a different search term or choose another category.</p>
        <button id="clear-filters" class="btn btn-outline-primary rounded-3 px-4 py-2 fw-medium" type="button">
            Clear filters
        </button>
    
    </div>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
