<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Courses Dashboard</title>
    <!-- FED-40 — apply appearance before first paint to prevent FOUC -->
<script>
    (function () {
        try {
            var stored = localStorage.getItem('mycourses:appearance');
            var resolved = stored;
            if (stored !== 'light' && stored !== 'dark') {
                resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', resolved);
        } catch (e) {
            document.documentElement.setAttribute('data-bs-theme', 'light');
        }
    })();
</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/appearance.css">
</head>
<body class="bg-light">
    <div class="app-shell">
        <aside class="sidebar-nav" id="mainSidebar" data-sidebar data-current="explore"></aside>

        <div class="app-content">
            <header id="appHeader" data-header data-page="explore" data-has-bell="true"></header>

            <main class="app-main">
                <section class="container my-3">
                    <div class="welcome-card rounded-4 py-3 px-4 py-md-4 px-md-5">
                        <div class="row align-items-center gy-4">
                            <div class="col-12 col-md-7 col-lg-8">
                                <span class="welcome-badge fw-bold text-uppercase small d-block mb-2">
                                    WELCOME BACK!
                                </span>
                                <h1 class="fw-bold text-dark display-6 mb-3">
                                    My Courses
                                </h1>
                                <p class="text-muted fs-6 mb-0 pe-md-4">
                                    Keep learning, keep growing. Here are the courses available for you.
                                </p>
                            </div>

                            <div class="col-12 col-md-5 col-lg-4 text-center text-md-end">
                                <div class="book-img-wrapper">
                                    <img src="assets/images/hero-img.webp" alt="Online learning and courses illustration" class="book-img">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="container my-3">
                    <h2 class="fw-bold text-dark mb-1">Courses</h2>
                    <p class="text-muted fs-6 mb-3 d-block d-lg-none">Discover and learn new skills</p>

                    <div class="row g-3 align-items-center">
                        <div class="col-12 col-md-8 col-lg-9">
                            <div class="input-group search-bar rounded-3 overflow-hidden border bg-white shadow-sm">
                                <span class="input-group-text bg-white border-0 ps-3 text-muted">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </span>
                                <input type="text" id="search-input" class="form-control border-0 shadow-none py-2 px-2 text-muted" placeholder="Search courses...">
                                <button id="clear-search" class="btn btn-white border-0 text-muted d-none" type="button" aria-label="Clear search input">
                                    <i class="fa-solid fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-12 col-md-4 col-lg-3">
                            <select id="category-filter" class="form-select rounded-3 border shadow-sm" aria-label="Filter by category">
    <option value="All" selected>All Categories</option>
</select>
                        </div>
                    </div>
                </section>

                <section class="container my-3">
                    <div class="row g-4" id="courses-container"></div>
                    <div id="no-results" class="d-none text-center py-5 my-5">
                        <i class="fa-solid fa-magnifying-glass fs-1 text-primary-subtle mb-4"></i>
                        <h4 class="fw-bold text-dark mb-3">No courses found</h4>
                        <p class="text-muted mb-3">Try a different search term or choose another category.</p>
                        <button id="clear-filters" class="btn btn-outline-primary rounded-3 px-4 py-2 fw-medium" type="button">
                            Clear filters
                        </button>
                    </div>
                </section>
            </main>

            <footer id="appFooter" data-footer data-variant="standard"></footer>
        </div>
    </div>

    <div class="modal fade" id="course-details-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header">
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-0 px-4 pb-4">
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-auto d-flex justify-content-center justify-content-md-start">
                            <div id="modal-icon"></div>
                        </div>
                        <div class="col-12 col-md">
                            <div class="text-center text-md-start mb-3">
                                <h4 id="modal-title" class="fw-bold text-dark mb-2"></h4>
                                <span id="modal-category-badge"></span>
                            </div>
                            <div class="d-flex flex-column gap-3">
                                <div class="modal-info-row">
                                    <i class="fa-solid fa-user text-secondary modal-icon-fixed"></i>
                                    <span class="label">Instructor</span>
                                    <span id="modal-instructor" class="value"></span>
                                </div>
                                <div class="modal-info-row">
                                    <i class="fa-solid fa-clock text-secondary modal-icon-fixed"></i>
                                    <span class="label">Duration</span>
                                    <span id="modal-duration" class="value"></span>
                                </div>
                                <div class="modal-info-row">
                                    <i class="fa-solid fa-chart-bar text-secondary modal-icon-fixed"></i>
                                    <span class="label">Level</span>
                                    <span id="modal-level" class="value"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr class="my-3">
<div id="modal-description-block">
    <h6 class="fw-bold text-dark mb-2">Description</h6>
    <p id="modal-description" class="text-muted mb-0"></p>
</div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4 justify-content-center justify-content-md-end">
                    <button type="button" class="btn btn-primary rounded-3 fw-medium modal-close-btn" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/profile-storage.js"></script>
    <script defer src="js/shell.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/course-card.js"></script>
    <script defer src="js/favorites-storage.js"></script>
    <script defer src="js/courses-api.js"></script>
    <script defer src="js/script.js"></script>
</body>
</html>
