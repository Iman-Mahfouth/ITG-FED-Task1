<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Student Courses Dashboard</title>
    <!-- FED-40 — apply appearance before first paint to prevent FOUC -->
<script>
    (function () {
        try {
            var stored = localStorage.getItem('mycourses:appearance');
            var resolved = stored;
            if (stored !== 'light' && stored !== 'dark') {
                resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', resolved);
        } catch (e) {
            document.documentElement.setAttribute('data-bs-theme', 'light');
        }
    })();
</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/favorites.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/appearance.css">
</head>
<body class="bg-light">
    <div class="app-shell">
        <aside class="sidebar-nav" id="mainSidebar" data-sidebar data-current="favorites"></aside>

        <div class="app-content">
            <header id="appHeader" data-header data-page="favorites"></header>

            <main class="app-main ml-favorites-page">
                <section class="container ml-favorites-hero my-3 my-lg-4" aria-labelledby="favorites-title">
                    <h1 id="favorites-title" class="ml-favorites-hero-title mb-2">Saved for a curious day.</h1>
                    <p class="ml-favorites-hero-subtitle mb-0">A collection of possibilities, picked by you.</p>
                </section>

                <section class="container ml-favorites-filter-bar mb-3" aria-label="Favorite course filters">
                    <div class="ml-favorites-filter-left" role="tablist" aria-label="Course categories">
                        <button type="button" class="ml-favorites-filter-pill ml-favorites-filter-pill--active" role="tab" aria-selected="true" data-filter="all" id="filter-all">All courses <span id="favorites-all-count" data-filter-count>0</span></button>
<button type="button" class="ml-favorites-filter-pill" role="tab" aria-selected="false" data-filter="Data &amp; Technology" id="filter-data">Data &amp; Technology <span id="favorites-data-count" data-filter-count>0</span></button>                        <a class="ml-favorites-browse-link" href="index.html"><i class="fa-solid fa-table-cells" aria-hidden="true"></i>Browse categories <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a>
                    </div>
                    <div class="ml-favorites-filter-right">
                        <div class="dropdown">
                            <button class="btn btn-white border dropdown-toggle ml-favorites-dropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false">All levels</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" type="button">All levels</button></li>
                                <li><button class="dropdown-item" type="button">Beginner</button></li>
                                <li><button class="dropdown-item" type="button">Intermediate</button></li>
                                <li><button class="dropdown-item" type="button">Advanced</button></li>
                            </ul>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-white border dropdown-toggle ml-favorites-dropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false">Recommended</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" type="button">Recommended</button></li>
                                <li><button class="dropdown-item" type="button">Highest rated</button></li>
                                <li><button class="dropdown-item" type="button">Shortest first</button></li>
                                <li><button class="dropdown-item" type="button">Title: A to Z</button></li>
                            </ul>
                        </div>
                    </div>
                </section>

                <section class="container" aria-live="polite">
                    <p id="favorites-count-line" class="ml-favorites-count-line">0 courses in your collection</p>
                    <div class="row g-4" id="favorites-container"></div>
                    <div id="favorites-empty-state" class="ml-empty-state d-none" role="status">
                        <i class="fa-regular fa-heart ml-empty-state-icon" aria-hidden="true"></i>
                        <h2 class="ml-empty-state-title">Keep a little inspiration here</h2>
                        <p class="ml-empty-state-subtitle">Tap the heart on any course to add it to your personal collection.</p>
                        <a href="index.html" class="ml-empty-state-action">Explore courses <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                    </div>
                </section>
            </main>

            <footer id="appFooter" data-footer data-variant="standard"></footer>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        <div id="favorites-toast" class="toast ml-favorites-toast border-0" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="favorites-toast-message" class="toast-body">Removed from your favorites.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/shell.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/profile-storage.js"></script>
    <script defer src="js/favorites-storage.js"></script>
    <script defer src="js/course-card.js"></script>
    <script defer src="js/courses-api.js"></script>
    <script defer src="js/favorites.js"></script>
</body>
</html>
