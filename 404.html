<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — Page Not Found — MyCourses</title>
    <!-- FED-40 — apply appearance before first paint to prevent FOUC -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('mycourses:appearance');
                var resolved = stored;
                if (stored !== 'light' && stored !== 'dark') {
                    resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', resolved);
            } catch (e) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/appearance.css">
    <link rel="stylesheet" href="css/404.css">
</head>
<body class="notfound-page">
    <button class="app-theme-toggle notfound-theme-toggle"
            type="button"
            aria-label="Toggle appearance"
            data-theme-toggle>
        <i class="fa-regular fa-moon theme-toggle-moon" aria-hidden="true"></i>
        <i class="fa-solid fa-sun theme-toggle-sun" aria-hidden="true"></i>
    </button>

    <main class="notfound-main">
        <div class="notfound-content">
            <div class="notfound-icon" aria-hidden="true">
                <i class="fa-solid fa-link-slash"></i>
            </div>

            <p class="notfound-eyebrow">WHERE TO NEXT?</p>
            <h1 class="notfound-heading">404 — Page not found.</h1>
            <p class="notfound-lead">
                This page doesn't exist or has been moved. Let's get you back on track.
            </p>

            <a href="index.html" class="notfound-cta">Back to Courses</a>
        </div>
    </main>

    <footer class="notfound-footer">
        <span>Made for your next chapter.</span>
        <span aria-hidden="true"> · </span>
        <span>MyCourses + Keep growing.</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
